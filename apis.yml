aid: violet
name: Violet
description: >-
  Violet Protocol provides privacy-preserving, reusable on-chain compliance and
  identity infrastructure for decentralized finance (DeFi). Its products —
  VioletID, Full AML/KYC screening, GeoFencing, and Sybil resistance — let
  crypto businesses meet regulatory requirements such as anti-money-laundering,
  sanctions screening, geo-blocking, accredited-investor verification, and proof
  of unique personhood. Integration is SDK and smart-contract based: Violet
  issues Ethereum Access Tokens (EATs) — OAuth 2.0-compliant, EIP-712-signed
  compliance assertions that carry no PII — and maintains the on-chain VioletID
  Registry that maps wallet addresses to verified compliance statuses, all built
  on W3C Decentralized Identifier and Verifiable Credential standards.
